services:
  db:
    image: postgres:16-alpine
    container_name: elearning-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: elearning
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d elearning"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: elearning-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://user:password@db:5432/elearning
      NODE_ENV: production
    env_file:
      - .env
    ports:
      - "3000:3000"

volumes:
  postgres_data:
